[project]
name = "conso-forecast"
version = "0.1.0"
description = "Day-ahead hourly forecasting of French electricity consumption from open data."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "holidays>=0.60",
    "lightgbm>=4.7",
    "matplotlib>=3.9",
    "mlflow>=2.18",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17",
    "requests>=2.32",
    "scikit-learn>=1.5",
]

[project.scripts]
conso-forecast = "conso_forecast.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.17",
]
notebook = [
    "jupyterlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conso_forecast"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear: likely bugs
    "UP",  # pyupgrade: modern syntax
    "SIM", # simplifications
    "PD",  # pandas-vet
    "NPY", # numpy-specific rules
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::DeprecationWarning:mlflow.*"]
